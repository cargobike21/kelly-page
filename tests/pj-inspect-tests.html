<!doctype html>
<html><head><meta charset="utf-8"><title>Packet Journey inspect + demo tests</title>
<link rel="stylesheet" href="../css/kelly.css"><link rel="stylesheet" href="../css/mcanalyser.css"><link rel="stylesheet" href="../css/pj.css"><link rel="stylesheet" href="../css/pj-inspect.css">
<style>#out{font:13px Consolas,monospace;white-space:pre-wrap}.ok{color:#3d8}.bad{color:#f55}</style>
</head><body>
<h3>Kelly Page -- Packet Journey: js/pj-inspect.js + js/pj-demo.js</h3>
<pre id="out">running…</pre>
<div class="pj"><div class="card pj-side" style="width:380px"><div id="pj-inspect"></div></div></div>
<script src="../js/mcdecode.js"></script>
<script src="../js/pj-core.js"></script>
<script src="../js/pj-demo.js"></script>
<script src="../js/pj-inspect.js"></script>
<script>
// Headless (timers fast-forwarded):
//   msedge --headless=new --allow-file-access-from-files --virtual-time-budget=60000 --dump-dom tests/pj-inspect-tests.html -> RESULT: ALL PASS
// The Node half (every demo packet decodes as intended): tests/pj-demo-test.js
const PJ = window.KellyPJ, D = window.KellyMcDecode, out = [], fails = [];
const eq = (name, got, want) => { if (JSON.stringify(got) === JSON.stringify(want)) out.push(`<span class="ok">PASS ${name}</span>`); else { out.push(`<span class="bad">FAIL ${name}: got ${JSON.stringify(got)} want ${JSON.stringify(want)}</span>`); fails.push(name); } };
const ok = (name, v) => eq(name, !!v, true);
const wait = ms => new Promise(r => setTimeout(r, ms));
let vis = true;
const bus = PJ.createBus(), reg = PJ.createRegistry();
const c = { bus, PJ, D, reg, $: s => document.querySelector(s), esc: s => String(s).replace(/[&<>"']/g, x => '&#' + x.charCodeAt(0) + ';'),
  store: { get: (k, d) => d, set() {} }, toast() {}, fmtAgo: ms => ms + ' ms', fxLoop() {}, audioCtx: () => null, fx: () => true, reduced: () => false,
  visible: () => vis, ingest: rx => PJ.ingest(bus, reg, rx, { channels: [PJ.DEMO_CHANNEL] }), root: () => document.body };
const selects = []; bus.on('select', s => selects.push(s));
(async () => {
  try {
    const mount = document.getElementById('pj-inspect');
    const insp = window.KellyPJInspect(mount, c);
    const eng = window.KellyPJDemo._engine(D, PJ.DEMO_CHANNEL, 777);
    // ---- 1. live list: batched, capped at 30, only while visible
    let fed = 0; for (let i = 0; i < 40; i++) for (const p of eng.next()) { c.ingest({ raw: p.raw, snr: p.snr, rssi: p.rssi, demo: true }); fed++; }
    eq('no synchronous redraw per packet', mount.querySelectorAll('.pj-insp-row').length, 0);
    await wait(500);
    eq('list shows the last 30', mount.querySelectorAll('.pj-insp-row').length, 30);
    vis = false; const before = mount.querySelector('.pj-insp-row').dataset.seq;
    for (const p of eng.next()) c.ingest({ raw: p.raw, snr: p.snr, rssi: p.rssi, demo: true });
    await wait(500);
    eq('hidden: list not redrawn', mount.querySelector('.pj-insp-row').dataset.seq, before);
    vis = true; bus.emit('visible', true);
    ok('visible again: list caught up', +mount.querySelector('.pj-insp-row').dataset.seq > +before);
    // ---- 2. pick one in the list -> breakdown + select emitted
    const row = mount.querySelector('.pj-insp-row');
    row.dispatchEvent(new PointerEvent('pointerdown', { bubbles: true, button: 0 }));
    const s = selects[selects.length - 1];
    ok('select emitted from inspect', s && s.from === 'inspect' && s.packet && s.packet.seq === +row.dataset.seq);
    ok('header bits shown', mount.querySelectorAll('.pj-insp-bit').length >= 8);
    ok('hex dump has every byte', mount.querySelectorAll('.pj-insp-b').length === s.packet.raw.length);
    ok('field blocks', mount.querySelectorAll('.pj-insp-blk').length === s.packet.d.fields.length);
    mount.querySelector('.pj-insp-blk[data-f="0"]').click();
    ok('tap a block -> explanation', /Header/.test(mount.querySelector('.pj-insp-explain h4').textContent) && mount.querySelector('.pj-insp-b.on'));
    // ---- 3. each kind shows: a decrypted chat, an advert with GPS + named path chips, a trace
    const want = { GRP_TXT: e => e.decrypted, ADVERT: e => e.gps && e.hops > 0, TRACE: e => true, TXT_MSG: e => true, CONTROL: e => true, RAW_CUSTOM: e => true, ANON_REQ: e => true };
    const got = {};
    const un = bus.on('packet', ev => { for (const t in want) if (!got[t] && ev.type === t && want[t](ev)) got[t] = ev; });
    for (let i = 0; i < 400 && Object.keys(got).length < Object.keys(want).length; i++) for (const p of eng.next()) c.ingest({ raw: p.raw, snr: p.snr, rssi: p.rssi, demo: true });
    un();
    for (const t in want) {
      ok('demo made ' + t, got[t]);
      if (!got[t]) continue;
      bus.emit('select', { packet: got[t], from: 'net' });
      ok(t + ' breakdown renders', mount.querySelector('.pj-insp-card') && !/Couldn't show/.test(mount.textContent));
    }
    bus.emit('select', { packet: got.GRP_TXT, from: 'net' });
    ok('chat text shown', mount.querySelector('.pj-insp-msg') && mount.querySelector('.pj-insp-msg').textContent.includes(got.GRP_TXT.text));
    bus.emit('select', { packet: got.ADVERT, from: 'net' });
    ok('advert GPS shown', mount.querySelector('.pj-insp-gps'));
    if (location.search.includes('keep')) { mount.querySelector('.pj-insp-blk[data-f="4"]').click(); out.push('kept for a screenshot'); document.getElementById('out').innerHTML = out.join('\n'); return; }   // ?keep: leave an advert open to look at
    const chips = [...mount.querySelectorAll('.pj-insp-chip.hash')].map(x => x.textContent);
    ok('path chips named (' + chips.join(' | ') + ')', chips.length === got.ADVERT.hops && chips.every(t => /Rptr/.test(t)));
    bus.emit('select', { packet: got.TRACE, from: 'net' });
    ok('trace SNR chips', mount.querySelectorAll('.pj-insp-chip.snr').length === got.TRACE.snrs.length);
    // ---- 4. a select with only a node filters; the chip clears it
    const n = selects.length; bus.emit('select', { packet: got.ADVERT, from: 'inspect' });
    const nodeId = got.ADVERT.src.id;
    bus.emit('select', { node: nodeId, from: 'net' }); await wait(10);
    const rows = [...mount.querySelectorAll('.pj-insp-row')];
    ok('filtered to the node', rows.length > 0 && mount.querySelector('.pj-insp-filter:not([hidden])'));
    mount.querySelector('[data-r="clearf"]').click();
    ok('filter cleared', mount.querySelector('.pj-insp-filter').hidden && mount.querySelectorAll('.pj-insp-row').length === 30);
    // ---- 5. pause freezes the list
    mount.querySelector('[data-r="pause"]').click();
    const top = mount.querySelector('.pj-insp-row').dataset.seq;
    for (const p of eng.next()) c.ingest({ raw: p.raw, snr: p.snr, rssi: p.rssi, demo: true });
    await wait(500);
    eq('paused: same top row', mount.querySelector('.pj-insp-row').dataset.seq, top);
    ok('paused: count says new', /new/.test(mount.querySelector('[data-r="count"]').textContent));
    mount.querySelector('[data-r="pause"]').click();
    // ---- 6. null-ish events never throw; reset clears
    bus.emit('packet', null); bus.emit('select', null); bus.emit('select', { packet: { seq: -1, kind: 'unknown', raw: null, d: null, journey: null }, from: 'x' });
    ok('a hollow packet still renders', mount.querySelector('.pj-insp-card'));
    bus.emit('reset'); await wait(10);
    eq('reset empties the list', mount.querySelectorAll('.pj-insp-row').length, 0);
    // ---- 7. the demo player: feeds c.ingest, pauses while hidden, stops
    let n2 = 0; const un2 = bus.on('packet', ev => { if (ev.demo) n2++; });
    const demo = window.KellyPJDemo(c);
    eq('not running before start', demo.running(), false);
    demo.start(); await wait(20000);
    ok(`demo fed ${n2} packets in 20 s (1 per 1-4 s, bursty)`, n2 >= 5 && n2 <= 40);
    vis = false; bus.emit('visible', false); const n3 = n2; await wait(10000);
    eq('hidden: no packets', n2, n3);
    vis = true; bus.emit('visible', true); await wait(10000);
    ok('visible: resumes', n2 > n3);
    demo.stop(); const n4 = n2; await wait(10000);
    eq('stopped: no packets', n2, n4);
    eq('running false', demo.running(), false);
    un2();
    insp.destroy(); eq('destroy empties the mount', mount.innerHTML, '');
  } catch (e) { fails.push('exception'); out.push(`<span class="bad">EXCEPTION ${e && e.stack || e}</span>`); }
  out.push(fails.length ? `RESULT: FAIL (${fails.join(', ')})` : 'RESULT: ALL PASS');
  document.getElementById('out').innerHTML = out.join('\n');
})();
</script>
</body></html>
